<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA² - Quantum Puzzle Game</title>
    <meta name="description" content="QA² は量子コンピューティングの世界を体験できるパズルゲームです。">
    <link rel="stylesheet" href="styles.css">
    <script>
        (function () {
            function detect() {
                try {
                    var params = new URLSearchParams(window.location.search);
                    var override = params.get('lang');
                    if (override === 'ja' || override === 'en') return override;
                } catch (e) {}
                var list = (navigator.languages && navigator.languages.length)
                    ? navigator.languages
                    : [navigator.language || navigator.userLanguage || 'en'];
                for (var i = 0; i < list.length; i++) {
                    if (String(list[i]).toLowerCase().indexOf('ja') === 0) return 'ja';
                }
                return 'en';
            }
            document.documentElement.lang = detect();
        })();
    </script>
</head>
